# =====================================================================
#  secgw — WAF · IPS · DDoS 한 장비 구성 설정
#
#  ★ 다른 장비에 설치할 때는 이 파일만 고칩니다. ★
#    고친 뒤:  sudo ./render.sh  →  sudo ./secgw.sh reload
#    (설정 파일·nftables·systemd 유닛은 render.sh 가 이 값으로 다시 만듭니다.
#     /etc/secgw 아래 파일을 직접 고치면 다음 render 때 덮어씌워집니다.)
# =====================================================================

# ── [1] 네트워크 : 장비마다 반드시 확인 ────────────────────────────────
WAN_IFACE="ens192"                 # 클라이언트 트래픽이 들어오는 인터페이스 (ip -br a 로 확인)
SERVICE_IP="203.0.113.10"          # WAF가 서비스할 이 장비의 IP
HTTP_PORT="80"                     # WAF 서비스 포트 (HTTP)
HTTPS_PORT="443"                   # WAF 서비스 포트 (HTTPS)
SERVER_NAME="www.example.com"      # 서비스 도메인
TLS_MODE="internal"                # acme(공인 인증서 자동) | internal(자체 서명) | off(HTTP만)
BACKEND_URL="http://10.0.0.21:8080"   # WAF 뒤에서 보호할 실제 웹 서버

HOME_NET="[10.0.0.0/24,203.0.113.10/32]"   # Suricata 내부망 정의 (공격자 방향 판단 기준)
MGMT_NET="10.0.0.0/24"             # SSH 관리 접속 허용 대역 — IPS·차단 대상에서 제외
SSH_PORT="22"
WHITELIST_IPS="10.0.0.3, 10.0.0.5" # 차단 예외 (모니터링 서버, 접속 많은 내부 서버 등)
                                   #  ↳ 3단계 실험: 기본 룰 오탐의 80%가 내부 서버 1대였음

# ── [2] 자원 제한 : 장비 사양에 맞춰 조정 (CPU 100% = 코어 1개) ──────────
TOTAL_CPU="300%"   ; TOTAL_MEM="4G"     # secgw 전체 상한 (secgw.slice)
WAF_CPU="100%"     ; WAF_MEM="512M"     # Caddy + Coraza(CRS)
WAF_AI_CPU="50%"   ; WAF_AI_MEM="384M"  # waf-ai 게이트 (CNN 판정)
IPS_CPU="150%"     ; IPS_MEM="2G"       # Suricata (ET Open 5만여 룰)
IPS_AI_CPU="25%"   ; IPS_AI_MEM="256M"  # ips-ai (흐름 판정)
DDOS_AI_CPU="25%"  ; DDOS_AI_MEM="256M" # ddos-ai (10초 구간 판정)

# ── [3] 룰 기준값 ─────────────────────────────────────────────────────
CRS_PARANOIA="1"                   # 1단계 실험: PL2 이상은 튜닝 없이 오탐 15% 이상
DDOS_RATE_PER_SEC="10"             # R1: IP당 초당 새 연결 (nftables limit)
DDOS_BURST="20"
DDOS_CONN_MAX="50"                 # R2: IP당 동시 연결 (nftables ct count)
DDOS_BLOCK_MINUTES="10"

# ── [4] AI 판정 ──────────────────────────────────────────────────────
AI_MODE="block"                    # block(차단) | monitor(기록만, 처음 설치 후 1~2주 권장)
AI_BLOCK_MINUTES="10"              # AI가 차단한 IP를 막아 두는 시간
WAF_AI_THRESHOLD="meta"            # meta = meta.json 기준값(검증 오탐 0.1%) 그대로, 숫자를 넣으면 그 값
IPS_AI_THRESHOLD="meta"
DDOS_AI_THRESHOLD="meta"
DDOS_AI_DELAY_SEC="120"            # 흐름 기록은 연결이 끝나야 나오므로, 구간을 이만큼 늦게 판정

# ── [5] 내부 값 : 보통 바꿀 필요 없음 ───────────────────────────────────
WAF_AI_LISTEN="127.0.0.1:8081"     # Caddy → waf-ai 게이트
IPS_QUEUE="0"                      # NFQUEUE 번호 (Suricata 인라인)
SECGW_HOME="/opt/secgw"            # 프로그램·모델 위치
SECGW_ETC="/etc/secgw"             # 생성된 설정 위치
SECGW_LOG="/var/log/secgw"         # eve.json, 판정 로그
